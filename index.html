<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ticket Reconciliation Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex flex-col items-center justify-center p-6 text-slate-100">
    <div class="max-w-xl w-full bg-slate-800 shadow-2xl rounded-2xl p-8 border border-slate-700 space-y-6">
        <div class="text-center">
            <h1 class="text-2xl font-bold text-white tracking-wide">Ticket Reconciliation Portal</h1>
            <p class="text-sm text-slate-400 mt-1">Upload any MIS report and PDFs to generate your audited sheet.</p>
        </div>

        <form id="auditForm" class="space-y-4">
            <!-- MIS Section -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-blue-400 mb-1">1. MIS Report Section (.xlsx)</label>
                <input type="file" id="misFile" accept=".xlsx" required class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer bg-slate-900/40 p-3 rounded-xl border border-slate-600">
            </div>

            <!-- PDF Section -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-emerald-400 mb-1">2. PDF Tickets Section (.pdf)</label>
                <input type="file" id="pdfFiles" accept=".pdf" multiple required class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-500 cursor-pointer bg-slate-900/40 p-3 rounded-xl border border-slate-600">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-medium py-3 px-4 rounded-xl shadow-lg hover:bg-blue-500 transition-all">
                Run Audit & Download Updated Excel Sheet
            </button>
        </form>
    </div>

    <script>
        document.getElementById("auditForm").addEventListener(
            "submit",
            async (e) => {

                e.preventDefault();

                const btn =
                    document.getElementById("submitBtn");

                const misFile =
                    document.getElementById("misFile").files[0];

                const pdfFiles =
                    document.getElementById("pdfFiles").files;

                if (!misFile) {
                    alert("Please select the MIS Excel file.");
                    return;
                }

                if (pdfFiles.length === 0) {
                    alert("Please select at least one PDF ticket.");
                    return;
                }

                btn.textContent = "Auditing tickets...";
                btn.disabled = true;

                const formData = new FormData();

                formData.append("mis_file", misFile);

                for (const file of pdfFiles) {
                    formData.append("pdf_files", file);
                }

                try {

                    const response = await fetch(
                        "/api/audit",
                        {
                            method: "POST",
                            body: formData
                        }
                    );

                    if (!response.ok) {

                        let message = "Audit failed.";

                        try {
                            const error = await response.json();

                            message =
                                error.details ||
                                error.error ||
                                message;

                        } catch (_) {}

                        throw new Error(message);
                    }

                    const blob = await response.blob();

                    if (!blob || blob.size === 0) {
                        throw new Error(
                            "The server returned an empty Excel file."
                        );
                    }

                    const url =
                        window.URL.createObjectURL(blob);

                    const link =
                        document.createElement("a");

                    link.href = url;

                    link.download =
                        "Audited_" + misFile.name;

                    document.body.appendChild(link);

                    link.click();

                    link.remove();

                    setTimeout(() => {
                        window.URL.revokeObjectURL(url);
                    }, 1000);

                    btn.textContent =
                        "Audit Complete ✓";

                } catch (error) {

                    console.error(error);

                    alert(
                        "Audit failed:\n\n" +
                        error.message
                    );

                    btn.textContent =
                        "Run Audit & Download Updated Excel Sheet";

                } finally {

                    btn.disabled = false;

                }

            }
        );
    </script>
</body>
</html>
